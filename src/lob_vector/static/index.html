<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOB Vector · 分块实验台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101412;
      --panel: #181e1b;
      --line: #303a35;
      --text: #edf5ef;
      --muted: #98a79f;
      --accent: #92e6b3;
      --accent-strong: #49bf78;
      --danger: #ff9b91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 90% 0%, rgba(73, 191, 120, .13), transparent 32rem),
        var(--bg);
      color: var(--text);
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { margin-bottom: 28px; }
    .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 8px 0 4px; font: 700 clamp(28px, 5vw, 48px)/1.1 system-ui, sans-serif; }
    header p { margin: 0; color: var(--muted); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, .9fr); gap: 20px; }
    .panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    textarea, input {
      width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #0d110f;
      color: var(--text); padding: 11px 12px; font: inherit; outline: none;
    }
    textarea:focus, input:focus { border-color: var(--accent-strong); }
    textarea { min-height: 330px; resize: vertical; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
    .metadata { margin-bottom: 14px; }
    button {
      width: 100%; border: 0; border-radius: 8px; padding: 12px 16px; cursor: pointer;
      background: var(--accent); color: #07120b; font: 700 14px ui-monospace, monospace;
    }
    button:hover { background: #b0f2c8; }
    .summary { display: flex; gap: 18px; margin-bottom: 14px; color: var(--muted); }
    .summary strong { color: var(--text); }
    .results { display: grid; gap: 10px; max-height: 570px; overflow: auto; padding-right: 4px; }
    .chunk { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #111613; }
    .chunk-head { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .chunk-head b { color: var(--accent); }
    pre { margin: 0; padding: 13px; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    .empty { color: var(--muted); padding: 48px 12px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
    .error { color: var(--danger); margin-top: 12px; min-height: 24px; }
    @media (max-width: 820px) { .workspace { grid-template-columns: 1fr; } main { padding-top: 28px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">LOB Vector / Stage 0</div>
      <h1>分块实验台</h1>
      <p>观察分块边界，并将每个 Chunk 转换为确定性的归一化向量。</p>
    </header>
    <div class="workspace">
      <section class="panel">
        <label for="text">原始文本</label>
        <textarea id="text">向量检索会把用户问题转换为向量，并在向量空间中寻找语义相近的文档片段。

文档进入系统后通常需要先分块。Chunk 太大会引入无关内容，太小则可能破坏完整语义。Overlap 会让相邻文本块共享一部分上下文，从而降低关键信息刚好落在边界处的风险。

在完成分块后，系统会为每个 Chunk 生成 Embedding，并连同来源、页码、部门和权限等 Metadata 一起保存。</textarea>
        <div class="controls">
          <div><label for="size">Chunk Size</label><input id="size" type="number" min="1" value="80"></div>
          <div><label for="overlap">Overlap</label><input id="overlap" type="number" min="0" value="20"></div>
          <div><label for="dimension">Vector Dimension</label><input id="dimension" type="number" min="1" value="32"></div>
        </div>
        <div class="metadata">
          <label for="metadata">Metadata（JSON）</label>
          <input id="metadata" value='{"source":"web-demo","stage":0}'>
        </div>
        <button id="run">分块并生成向量</button>
        <div id="error" class="error"></div>
      </section>
      <section class="panel">
        <div class="summary"><span>文档 <strong id="length">—</strong> 字符</span><span>生成 <strong id="count">—</strong> 块</span><span>向量 <strong id="dimensionValue">—</strong> 维</span></div>
        <div id="results" class="results"><div class="empty">点击“执行分块”查看结果</div></div>
      </section>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (text) => text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function run() {
      $('error').textContent = '';
      try {
        const response = await fetch('/api/chunk', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            text: $('text').value,
            chunk_size: Number($('size').value),
            overlap: Number($('overlap').value),
            dimension: Number($('dimension').value),
            metadata: JSON.parse($('metadata').value || '{}')
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '分块失败');
        $('length').textContent = data.document_length;
        $('count').textContent = data.chunk_count;
        $('dimensionValue').textContent = data.embedding_dimension;
        $('results').innerHTML = data.chunks.map(chunk => `
          <article class="chunk">
            <div class="chunk-head"><b>CHUNK ${chunk.index}</b><span>${chunk.start} → ${chunk.end} · ${chunk.length} 字符</span></div>
            <pre>${escapeHtml(chunk.content)}</pre>
            <div class="chunk-head"><b>VECTOR</b><span>模长 ${chunk.vector_norm.toFixed(6)}</span></div>
            <pre>[${chunk.vector.slice(0, 8).map(value => value.toFixed(4)).join(', ')}${chunk.vector.length > 8 ? ', …' : ''}]</pre>
          </article>`).join('');
      } catch (error) {
        $('error').textContent = error.message;
      }
    }
    $('run').addEventListener('click', run);
    run();
  </script>
</body>
</html>
